name: Release to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-wheels:
    strategy:
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Check out the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install Python packages needed for wheel build and check
      run: python -m pip install twine

    - name: Build wheels
      uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0

    - name: Check wheels
      run: python -m twine check --strict wheelhouse/*.whl

    - name: Store the wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest

    steps:

    - name: Check out the release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    - name: Install Python packages needed for sdist build and check
      run: python -m pip install build twine

    - name: Build sdist
      run: python -m build --sdist

    - name: Check sdist
      run: python -m twine check --strict dist/*

    - name: Store the sdist
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write

    steps:

    - name: Retrieve the distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
